name: build-all

# Exercises the root CMakeLists.txt, which builds and installs both C++
# subprojects in one command. The per-subproject workflows already cover
# each one in isolation; this one guards the thing that's new: that they
# still configure and install together from the top level.

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'insta360-to-images/**'
      - 'insta360-test-calib/**'
      - '.github/workflows/build-all.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'insta360-to-images/**'
      - 'insta360-test-calib/**'
      - '.github/workflows/build-all.yml'

env:
  RAYLIB_VERSION: '5.5'

jobs:
  build-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Union of both subprojects' dependencies: OpenCV/ffmpeg for
      # insta360-to-images, yaml-cpp, Ceres and the X11/GL headers raylib's
      # static build needs for insta360-test-calib (raylib bundles its own
      # GLFW source, so no glfw dev package is needed).
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopencv-dev ffmpeg libyaml-cpp-dev libceres-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv ffmpeg yaml-cpp ceres-solver

      # No package manager ships raylib as a static library (this project
      # requires raylib_USE_STATIC_LIBS), so build the pinned version from
      # source, matching how it's installed on developer machines.
      - name: Cache raylib build
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/raylib-install
          key: raylib-${{ env.RAYLIB_VERSION }}-${{ runner.os }}-v1

      - name: Build raylib ${{ env.RAYLIB_VERSION }} (static)
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "${RAYLIB_VERSION}" --depth 1 https://github.com/raysan5/raylib.git "${{ runner.temp }}/raylib-src"
          cmake -S "${{ runner.temp }}/raylib-src" -B "${{ runner.temp }}/raylib-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/raylib-install"
          cmake --build "${{ runner.temp }}/raylib-build" -j
          cmake --install "${{ runner.temp }}/raylib-build"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/raylib-install"

      - name: Build
        run: cmake --build build -j

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/install"

      - name: Check installed binaries
        run: |
          test -x "${{ runner.temp }}/install/bin/insta360-to-images"
          test -x "${{ runner.temp }}/install/bin/calib_app"
